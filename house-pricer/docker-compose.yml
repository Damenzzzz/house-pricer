name: house-pricer

x-house-pricer: &house-pricer
  build: .
  image: house-pricer:latest
  env_file: .env
  environment:
    QDRANT_URL: http://qdrant:6333
    HOUSE_PRICER_VAR: /data/var
  volumes:
    - house_pricer_var:/data/var
  restart: unless-stopped

services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  init:
    <<: *house-pricer
    command: ["python", "qdrant_store.py", "ensure"]
    restart: "no"
    depends_on:
      qdrant:
        condition: service_healthy

  app:
    <<: *house-pricer
    ports:
      - "8501:8501"
    depends_on:
      init:
        condition: service_completed_successfully

  bot:
    <<: *house-pricer
    command: ["python", "telegram_bot.py"]
    profiles: ["telegram"]
    healthcheck:
      disable: true
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  qdrant_data:
  house_pricer_var:
